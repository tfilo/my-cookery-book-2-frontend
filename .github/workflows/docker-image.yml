name: Docker Image CI

on:
  push:
    tags: [ "*" ]

jobs:

  docker:
    permissions:
      actions: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: docker login
      env:
        DOCKER_USER: ${{secrets.DOCKER_USER}}
        DOCKER_PASSWORD: ${{secrets.DOCKER_PASSWORD}}
      run: docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
    - name: Build the Docker image
      env:
        DOCKER_USER: ${{secrets.DOCKER_USER}}
      run: docker build . -f Dockerfile -t "${DOCKER_USER}/my-cookery-book-2-frontend:${{github.ref_name}}" -t "${DOCKER_USER}/my-cookery-book-2-frontend:latest"
    - name: Docker push
      env:
        DOCKER_USER: ${{secrets.DOCKER_USER}}
      run: docker image push --all-tags "${DOCKER_USER}/my-cookery-book-2-frontend"
